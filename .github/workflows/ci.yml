name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build y tests
        run: ./mvnw -B verify

      - name: Lint del contrato OpenAPI
        run: npx --yes @stoplight/spectral-cli lint src/main/resources/openapi/openapi.yml

      # El runner tiene Docker: Jib deja la imagen en el daemon local, sin publicarla.
      - name: Imagen de contenedor (sin publicar)
        run: ./mvnw -B package -DskipTests -Dquarkus.container-image.build=true -Dquarkus.container-image.group=ci
