openapi: 3.0.3
info:
  title: Account status (development)
  description: >
    Development-only contract to look up a customer's account status by phone number.
    Available only under the `dev` profile.
  version: "1.0.0"
paths:
  /dev/customers/{phone}/account-status:
    get:
      operationId: getCustomerAccountStatus
      summary: Get a customer's account status
      tags:
        - Customers
      parameters:
        - name: phone
          in: path
          required: true
          description: Customer's phone number, in any format accepted by PhoneNormalizer.
          schema:
            type: string
      responses:
        "200":
          description: >
            Computed account status. Returned even for a phone number that is not registered
            (`registered: false`) or has no chargeable orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
        "503":
          description: The Google Sheets workbook is unavailable.
components:
  schemas:
    AccountStatus:
      type: object
      required:
        - registered
        - campaigns
        - grandTotal
      properties:
        registered:
          type: boolean
        customerName:
          type: string
          nullable: true
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/CampaignAccount"
        grandTotal:
          type: number
          description: Amount with scale 2.
    CampaignAccount:
      type: object
      required:
        - campaignTitle
        - number
        - catalog
        - groups
        - soldOut
        - unpriced
        - total
      properties:
        campaignTitle:
          type: string
        number:
          type: integer
        catalog:
          type: string
        paymentDate:
          type: string
          nullable: true
          description: Date in dd/MM/yyyy format, or null if no chargeable row has a date.
          example: "15/10/2026"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/RecipientGroup"
        soldOut:
          type: array
          items:
            $ref: "#/components/schemas/GarmentInfo"
        unpriced:
          type: array
          items:
            $ref: "#/components/schemas/GarmentInfo"
        total:
          type: number
    RecipientGroup:
      type: object
      required:
        - items
        - subtotal
      properties:
        recipient:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/Garment"
        subtotal:
          type: number
    Garment:
      type: object
      required:
        - product
        - size
        - amount
        - status
      properties:
        product:
          type: string
        size:
          type: string
        amount:
          type: number
        status:
          type: string
          description: Literal status text from the Google Sheet.
          enum:
            - PENDIENTE
            - ENTREGADO
    GarmentInfo:
      type: object
      required:
        - product
        - size
      properties:
        product:
          type: string
        size:
          type: string
        recipient:
          type: string
          nullable: true
