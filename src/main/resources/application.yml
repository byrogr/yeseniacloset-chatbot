quarkus:
  rest:
    path: /api/v1
  http:
    access-log:
      enabled: false
  jackson:
    fail-on-unknown-properties: false
  rest-client:
    whatsapp-graph:
      url: ${whatsapp.api-base-url}
      connect-timeout: 5000
      read-timeout: 10000
  langchain4j:
    azure-openai:
      endpoint: ${FOUNDRY_ENDPOINT}
      api-key: ${FOUNDRY_API_KEY}
      deployment-name: ${FOUNDRY_DEPLOYMENT}
      api-version: ${FOUNDRY_API_VERSION}
      timeout: 30s
      chat-model:
        temperature: 0.2
        max-tokens: 500
      log-requests: false
      log-responses: false
  container-image:
    registry: ghcr.io
    group: ${CONTAINER_IMAGE_GROUP:}   # usuario de GitHub, en minúsculas
    name: yeseniacloset-chatbot
    build: false
    push: false
  jib:
    base-jvm-image: registry.access.redhat.com/ubi9/openjdk-21-runtime
    platforms: linux/amd64
  otel:
    metrics:
      enabled: true
    # Solo métricas: las trazas de HTTP y de LangChain4j podrían llevar celulares o texto de mensajes.
    traces:
      enabled: false
    azure:
      applicationinsights:
        connection:
          string: ${APPLICATIONINSIGHTS_CONNECTION_STRING:}

sheets:
  spreadsheet-id: ${SHEETS_SPREADSHEET_ID}
  credentials-file: ${SHEETS_CREDENTIALS_FILE:}
  credentials-json: ${SHEETS_CREDENTIALS_JSON:}
  cache-ttl: 60s
  stale-max: 30m

whatsapp:
  api-base-url: https://graph.facebook.com
  api-version: v25.0
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  access-token: ${WHATSAPP_ACCESS_TOKEN}
  app-secret: ${WHATSAPP_APP_SECRET}
  verify-token: ${WHATSAPP_VERIFY_TOKEN}
  dedupe-ttl: 24h
  max-text-length: 4096

bot:
  owner-name: ${BOT_OWNER_NAME}
  owner-contact-phone: ${BOT_OWNER_CONTACT_PHONE:}   # 51 + 9 dígitos; vacío = modo coexistencia
  enabled: ${BOT_ENABLED:true}
  allowlist: ${BOT_ALLOWLIST:}       # celulares separados por coma; vacío = todas las clientas
  memory:
    max-messages: 10
    ttl: 30m
  pause:
    duration: 12h

"%prod":
  quarkus:
    http:
      access-log:
        enabled: false
    log:
      level: INFO
      category:
        "com.google":
          level: WARN
        "dev.langchain4j":
          level: WARN
        "io.quarkiverse.langchain4j":
          level: WARN
    langchain4j:
      azure-openai:
        log-requests: false
        log-responses: false

"%dev":
  quarkus:
    otel:
      sdk:
        disabled: true
    langchain4j:
      azure-openai:
        log-requests: true
        log-responses: true

"%test":
  quarkus:
    otel:
      sdk:
        disabled: true
    fault-tolerance:
      "pe.rmsolutions.chatbot.whatsapp.repository.CloudApiMessenger/sendText":
        retry:
          delay: 10
          delay-unit: millis
    langchain4j:
      azure-openai:
        endpoint: ${FOUNDRY_ENDPOINT:https://dummy.openai.azure.com/openai/deployments/dummy}
        api-key: ${FOUNDRY_API_KEY:dummy}
        deployment-name: ${FOUNDRY_DEPLOYMENT:dummy}
        api-version: ${FOUNDRY_API_VERSION:2024-10-21}
  sheets:
    spreadsheet-id: test-spreadsheet
    credentials-file: unused
    credentials-json: ""
  bot:
    owner-name: Yesenia
  whatsapp:
    phone-number-id: TEST_PHONE_NUMBER_ID
    access-token: test-access-token
    app-secret: test-app-secret
    verify-token: test-verify-token
